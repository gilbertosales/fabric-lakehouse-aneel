name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mesmas versões do Fabric Runtime 1.3 (Spark 3.5 / Python 3.11)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Testes (PySpark local)
        run: pytest -v

      - name: Gerar wheel para o Environment do Fabric
        run: pip wheel --no-deps -w dist .

      - uses: actions/upload-artifact@v4
        with:
          name: aneel_lakehouse-wheel
          path: dist/*.whl
